name: Refresh profile art
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/update-profile.yml
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - assets/**
      - .github/workflows/update-profile.yml
permissions:
  contents: read
concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_profile.py --data assets/profile-data.json --output /tmp/profile-art
      - run: diff -r assets /tmp/profile-art
  refresh:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile.py
      - name: Commit changed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh profile artwork'
          git push
