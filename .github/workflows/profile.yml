name: Refresh terminal profile

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', '.github/workflows/profile.yml']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'assets/**', 'README.md', '.github/workflows/profile.yml']

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_profile.py --fixture tests/fixtures/profile.json --output /tmp/profile-art
  refresh:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate from live GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile.py
      - name: Commit changed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh terminal profile artwork"
            git push origin HEAD:main
          fi
